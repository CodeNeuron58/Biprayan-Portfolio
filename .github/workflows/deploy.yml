name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify rollup native binary is present
        # Belt-and-suspenders against npm optional-dependency bug cli#4828.
        # Lists the platform-specific native binary that Rollup needs and
        # fails the build with a clear message if it is missing.
        run: |
          if [ -z "$(ls node_modules/@rollup 2>/dev/null)" ]; then
            echo "::error::No @rollup/* native binary installed."
            echo "::error::npm ci did not install an optional rollup native binary."
            echo "::error::See https://github.com/npm/cli/issues/4828"
            exit 1
          fi
          ls -1 node_modules/@rollup
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the docs folder
          path: './docs'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
